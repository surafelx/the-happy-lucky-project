<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sunday 1 thumbnail</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@600;700;800&display=block" rel="stylesheet" />
<style>
  /* 1280x720, the size YouTube asks for. Open with ?v=a (dark), ?v=b (light) or ?v=c (dark, with the video still). */
  :root{--ink:#1F1A1C;--rose:#E47FC8;--rose-deep:#C75AA8;--teal:#4B9B9D;--gold:#F3BC29;--dark:#0F1D1E;--mint:#F6FFFA}
  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:720px;overflow:hidden}
  body{font-family:Poppins,sans-serif;position:relative}
  .blob{position:absolute;border-radius:42% 58% 63% 37%/48% 40% 60% 52%}
  .lucky{font-family:"Luckiest Guy",cursive;font-weight:400;line-height:.86;letter-spacing:.01em}
  .logo{position:absolute}
  .pill{position:absolute;display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:34px;letter-spacing:.06em;text-transform:uppercase;border:5px solid var(--ink);border-radius:999px;padding:12px 30px;box-shadow:7px 7px 0 var(--ink)}
  .brand{position:absolute;font-family:"Luckiest Guy",cursive;font-size:36px;letter-spacing:.04em}
  .play{display:grid;place-items:center;border-radius:50%;border:6px solid var(--ink);box-shadow:9px 9px 0 var(--ink)}
  .play::after{content:"";display:block;width:0;height:0;border-style:solid;margin-left:12%}

  /* ---------- A: the site's dark ground ---------- */
  body.a{background:var(--dark);color:var(--mint)}
  .a .b1{width:620px;height:560px;left:-190px;top:-230px;background:var(--rose)}
  .a .b2{width:430px;height:400px;left:-150px;bottom:-190px;background:var(--gold);border-radius:58% 42% 40% 60%/50% 62% 38% 50%}
  .a .b3{width:560px;height:500px;right:-200px;top:-210px;background:var(--teal);border-radius:52% 48% 60% 40%/45% 55% 45% 55%}
  .a .logo{width:250px;height:250px;left:70px;top:60px;transform:rotate(-8deg)}
  .a h1{position:absolute;left:84px;top:312px;font-size:206px;color:var(--mint);text-shadow:10px 10px 0 #000}
  .a .one{position:absolute;left:850px;top:150px;width:360px;height:390px;display:grid;place-items:center}
  .a .one b{font-family:"Luckiest Guy",cursive;font-weight:400;font-size:400px;line-height:1;color:var(--rose);text-shadow:12px 12px 0 #000;transform:translateY(24px) rotate(6deg);display:block}
  .a .one svg{position:absolute;inset:-40px -40px;width:calc(100% + 80px);height:calc(100% + 80px);color:var(--gold);overflow:visible}
  .a .pill{left:88px;top:548px;background:var(--gold);color:var(--ink)}
  .a .brand{left:92px;top:650px;color:var(--mint);opacity:.92}

  /* ---------- B: light, a letter with a play button ---------- */
  body.b{background:var(--rose);color:var(--ink)}
  .b .b1{width:560px;height:520px;right:-170px;top:-220px;background:var(--gold)}
  .b .b2{width:460px;height:420px;left:-170px;bottom:-200px;background:var(--teal);border-radius:58% 42% 40% 60%/50% 62% 38% 50%}
  .b .b3{display:none}
  .b h1{position:absolute;left:76px;top:64px;font-size:200px;color:var(--mint);-webkit-text-stroke:0;text-shadow:9px 9px 0 var(--ink)}
  .b h1 em{font-style:normal;color:var(--gold);display:block;font-size:330px;line-height:.8;margin-top:6px;text-shadow:11px 11px 0 var(--ink)}
  .b .env{position:absolute;right:70px;top:270px;width:430px;height:300px;background:var(--mint);border:7px solid var(--ink);border-radius:30px;box-shadow:14px 14px 0 var(--ink);transform:rotate(5deg);overflow:hidden}
  .b .env::before,.b .env::after{content:"";position:absolute;left:50%;width:520px;height:520px;border:7px solid var(--ink);transform:translateX(-50%) rotate(45deg);border-radius:26px}
  .b .env::before{top:-386px;background:#fff}
  .b .env::after{bottom:-420px;background:#E9F6F1}
  .b .env .play{position:absolute;left:50%;top:50%;width:168px;height:168px;margin:-84px 0 0 -84px;background:var(--teal);z-index:2}
  .b .env .play::after{border-width:34px 0 34px 58px;border-color:transparent transparent transparent #fff}
  .b .logo{width:160px;height:160px;right:26px;top:200px;transform:rotate(14deg);z-index:3}
  .b .pill{left:258px;top:392px;font-size:28px;padding:10px 24px;background:var(--mint);color:var(--ink)}
  .b .brand{left:84px;top:640px;color:var(--ink)}

  /* ---------- C: the dark ground, with a still from the video ---------- */
  body.c{background:var(--dark);color:var(--mint)}
  .c .b1{width:560px;height:500px;left:-210px;top:-250px;background:var(--rose)}
  .c .b2{width:430px;height:400px;left:-150px;bottom:-200px;background:var(--gold);border-radius:58% 42% 40% 60%/50% 62% 38% 50%}
  .c .b3{width:640px;height:600px;right:-230px;top:-170px;background:var(--teal);border-radius:52% 48% 60% 40%/45% 55% 45% 55%}
  .c .photo{position:absolute;right:66px;top:82px;width:560px;height:500px;border:9px solid var(--mint);border-radius:40px;box-shadow:16px 16px 0 var(--gold);transform:rotate(3deg);overflow:hidden;background:#223}
  .c .photo img{width:100%;height:100%;object-fit:cover;object-position:42% 30%;display:block}
  .c .logo{width:170px;height:170px;left:574px;top:14px;transform:rotate(-12deg);z-index:3}
  .c h1{position:absolute;left:70px;top:150px;font-size:150px;color:var(--mint);text-shadow:8px 8px 0 #000}
  .c .one{position:absolute;left:150px;top:268px;width:260px;height:270px;display:grid;place-items:center}
  .c .one b{font-family:"Luckiest Guy",cursive;font-weight:400;font-size:300px;line-height:1;color:var(--rose);text-shadow:10px 10px 0 #000;transform:translateY(20px) rotate(6deg);display:block}
  .c .one svg{position:absolute;inset:-24px -70px;width:calc(100% + 140px);height:calc(100% + 48px);color:var(--gold);overflow:visible}
  .c .pill{left:70px;top:574px;background:var(--gold);color:var(--ink);font-size:30px;padding:10px 26px}
  .c .brand{left:74px;top:662px;color:var(--mint);opacity:.92;font-size:32px}

  /* ---------- D: the still on a light ground ---------- */
  body.d{background:var(--mint);color:var(--ink)}
  .d .b1{width:560px;height:500px;left:-210px;top:-250px;background:var(--rose)}
  .d .b2{width:430px;height:400px;left:-150px;bottom:-200px;background:var(--gold);border-radius:58% 42% 40% 60%/50% 62% 38% 50%}
  .d .b3{width:640px;height:600px;right:-230px;top:-170px;background:var(--teal);border-radius:52% 48% 60% 40%/45% 55% 45% 55%}
  .d .photo{position:absolute;right:66px;top:82px;width:560px;height:500px;border:8px solid var(--ink);border-radius:40px;box-shadow:16px 16px 0 var(--ink);transform:rotate(3deg);overflow:hidden;background:#223}
  .d .photo img{width:100%;height:100%;object-fit:cover;object-position:42% 30%;display:block}
  .d .logo{width:170px;height:170px;left:574px;top:14px;transform:rotate(-12deg);z-index:3}
  .d h1{position:absolute;left:70px;top:150px;font-size:150px;color:var(--ink);text-shadow:7px 7px 0 var(--gold)}
  .d .one{position:absolute;left:150px;top:268px;width:260px;height:270px;display:grid;place-items:center}
  .d .one b{font-family:"Luckiest Guy",cursive;font-weight:400;font-size:300px;line-height:1;color:var(--rose);text-shadow:10px 10px 0 var(--ink);transform:translateY(20px) rotate(6deg);display:block}
  .d .one svg{position:absolute;inset:-24px -70px;width:calc(100% + 140px);height:calc(100% + 48px);color:var(--teal);overflow:visible}
  .d .pill{left:70px;top:574px;background:var(--gold);color:var(--ink);font-size:30px;padding:10px 26px}
  .d .brand{left:74px;top:662px;color:var(--ink);font-size:32px}
</style>
</head>
<body>
<script>
  const q = new URLSearchParams(location.search).get("v");
  const v = ["b", "c", "d"].includes(q) ? q : "a";
  document.body.className = v;
</script>

<i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>

<svg class="logo" viewBox="-8 -8 116 116" aria-hidden="true">
  <g transform="translate(50 50)" fill="#4B9B9D" stroke="#E47FC8" stroke-width="3.5" stroke-linejoin="round">
    <path id="leaf" d="M0 0C-14-9-27-21-23-34C-20-44-8-46 0-38C8-46 20-44 23-34C27-21 14-9 0 0Z" transform="rotate(-45) scale(1.12)"/>
    <use href="#leaf" transform="rotate(90)"/><use href="#leaf" transform="rotate(180)"/><use href="#leaf" transform="rotate(270)"/>
  </g>
  <circle cx="50" cy="50" r="26" fill="#F3BC29" stroke="#E47FC8" stroke-width="3.5"/>
  <circle cx="41.5" cy="45" r="2.6" fill="#E47FC8"/><circle cx="58.5" cy="45" r="2.6" fill="#E47FC8"/>
  <path d="M39.5 56.5q10.5 10 21 0M38 55.5h3M59 55.5h3" fill="none" stroke="#E47FC8" stroke-width="3" stroke-linecap="round"/>
</svg>

<!-- A -->
<template id="ta">
  <h1 class="lucky">SUNDAY</h1>
  <div class="one">
    <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" aria-hidden="true">
      <path d="M26 96C30 28 176 14 184 92c6 72-132 110-166 34"/>
    </svg>
    <b>1</b>
  </div>
  <span class="pill">▶ A letter you can watch</span>
  <span class="brand">HAPPY LUCKY CHACHO</span>
</template>

<!-- B -->
<template id="tb">
  <h1 class="lucky">SUNDAY <em>1</em></h1>
  <div class="env"><span class="play"></span></div>
  <span class="pill">A letter you can watch</span>
  <span class="brand">HAPPY LUCKY CHACHO</span>
</template>

<!-- C -->
<template id="tc">
  <div class="photo"><img src="sunday-1-still.jpg" alt="" /></div>
  <h1 class="lucky">SUNDAY</h1>
  <div class="one">
    <svg viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" aria-hidden="true">
      <path d="M26 96C30 28 176 14 184 92c6 72-132 110-166 34"/>
    </svg>
    <b>1</b>
  </div>
  <span class="pill">▶ A letter you can watch</span>
  <span class="brand">HAPPY LUCKY CHACHO</span>
</template>

<script>
  document.body.appendChild(document.getElementById("t" + (v === "d" ? "c" : v)).content.cloneNode(true));
</script>
</body>
</html>
